name: CI

on:
  push:
    branches:
      - version-16
  pull_request:

concurrency:
  group: version-16-kxcompliance-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app kxcompliance $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app kxcompliance
          bench build --app kxcompliance
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app kxcompliance
        env:
          TYPE: server

  frontend:
    runs-on: ubuntu-latest
    name: Front end

    steps:
      # The front end uses Frappe's shared UI package (@framework/ui), linked from ../../frappe/ui
      # as on a bench, so both are checked out side by side.
      - uses: actions/checkout@v6
        with:
          path: apps/kxcompliance
      - uses: actions/checkout@v6
        with:
          repository: frappe/frappe
          ref: version-16
          path: apps/frappe
          sparse-checkout: ui
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            apps/kxcompliance/frontend/yarn.lock
            apps/frappe/ui/yarn.lock
      # Frappe's own lockfile can trail its package.json on the branch, so it is not frozen here;
      # the app's own install below is.
      - name: Install Frappe's UI package
        working-directory: apps/frappe/ui
        run: yarn install
      - name: Install
        working-directory: apps/kxcompliance/frontend
        run: yarn install --frozen-lockfile
      - name: Test
        working-directory: apps/kxcompliance/frontend
        run: yarn test
